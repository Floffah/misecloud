import "google/protobuf/empty.proto";

option go_package = "github.com/floffah/misecloud/api/atoc;atoc";

service Health {
  rpc Check(google.protobuf.Empty) returns (HealthCheckResponse) {}
}

enum ServingStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}
message HealthCheckResponse {
  required ServingStatus status = 1;
}

service ControllerSetup {
    rpc GetIsSetup(google.protobuf.Empty) returns (GetIsSetupResponse) {}

    rpc SetUp(SetupRequest) returns (google.protobuf.Empty) {}
}

message GetIsSetupResponse {
    required bool is_setup = 1;
}

message SetupRequest {
    required string port = 1;
}